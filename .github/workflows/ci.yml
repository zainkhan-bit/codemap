name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      # better-sqlite3 downloads a prebuilt binary at install time. That download is intermittently
      # flaky on hosted runners; Linux/macOS then compile from source, but Windows runners have no
      # C++ toolchain, so a transient failure must be retried rather than fail the job.
      - name: Install dependencies (with retry)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            pnpm install --frozen-lockfile && exit 0
            echo "::warning::pnpm install failed (attempt $attempt); retrying"
            sleep $((attempt * 10))
          done
          exit 1
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm exec vitest run
      - name: Package smoke test (install packed tarballs outside the workspace)
        shell: bash
        run: |
          set -euo pipefail
          # POSIX-style paths so the same script works in Git Bash on Windows.
          tmp="$(cd "$RUNNER_TEMP" && pwd)"; repo="$(cd "$GITHUB_WORKSPACE" && pwd)"
          packs="$tmp/packs"; smoke="$tmp/smoke"
          mkdir -p "$packs" "$smoke"
          pnpm -r --filter "./packages/**" --filter "./apps/**" exec pnpm pack --pack-destination "$packs"
          # Run tar from inside the directory: GNU tar reads "D:..." as a remote host.
          (cd "$packs" && tar -tzf codemap-adapter-python-0.1.0.tgz >/dev/null)
          cd "$smoke"
          npm init -y >/dev/null
          installed=false
          for attempt in 1 2 3; do
            if npm install --no-audit --no-fund "$packs"/*.tgz; then installed=true; break; fi
            echo "::warning::npm install failed (attempt $attempt); retrying"
            sleep $((attempt * 10))
          done
          $installed
          test -f node_modules/tree-sitter-python/tree-sitter-python.wasm
          test -f node_modules/tree-sitter-typescript/tree-sitter-tsx.wasm
          export CODEMAP_DATA_DIR="$tmp/codemap-data"
          npx codemap --version
          npx codemap doctor
          npx codemap scan "$repo/tests/fixtures/fixture-ts-paths"
          cd "$repo/tests/fixtures/fixture-ts-paths"
          npx --prefix "$smoke" codemap export --format svg --output "$tmp/map.svg"
          test -s "$tmp/map.svg"
          npx --prefix "$smoke" codemap export --format png --output "$tmp/map.png"
          test -s "$tmp/map.png"
          # Dashboard from the packed packages: link printed, API needs the token, assets served.
          node "$smoke/node_modules/@codemap/cli/dist/index.js" dashboard --no-open > "$tmp/dash.log" 2>&1 &
          dash=$!
          for _ in $(seq 1 30); do grep -q '#token=' "$tmp/dash.log" && break; sleep 1; done
          link="$(grep -o 'http://127\.0\.0\.1:[0-9]*/#token=[A-Za-z0-9_-]*' "$tmp/dash.log")"
          base="${link%%#*}"; token="${link##*token=}"
          test "$(curl -s -o /dev/null -w '%{http_code}' "${base}api/v1/health")" = "401"
          curl -fsS -H "Authorization: Bearer $token" "${base}api/v1/health" | grep -q '"readOnly":true'
          curl -fsS "$base" | grep -q 'id="app"'
          kill "$dash"

  # The one-command installers, run against this commit (cloned from the checkout, not GitHub).
  installer:
    name: installer · ${{ matrix.os }}
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: install.sh
        if: runner.os != 'Windows'
        env:
          CODEMAP_REPO: file://${{ github.workspace }}
          CODEMAP_REF: ${{ github.ref_name }}
        run: |
          bash scripts/install.sh
          ~/.local/bin/codemap scan tests/fixtures/fixture-python
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CODEMAP_REPO: ${{ github.workspace }}
          CODEMAP_REF: ${{ github.ref_name }}
        run: |
          ./scripts/install.ps1
          codemap scan tests/fixtures/fixture-python
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
