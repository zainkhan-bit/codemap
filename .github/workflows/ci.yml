name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm exec vitest run
      - name: Package smoke test (install packed tarballs outside the workspace)
        shell: bash
        run: |
          set -euo pipefail
          packs="$RUNNER_TEMP/packs"; smoke="$RUNNER_TEMP/smoke"
          mkdir -p "$packs" "$smoke"
          pnpm -r --filter "./packages/**" --filter "./apps/**" exec pnpm pack --pack-destination "$packs"
          tar -tzf "$packs/codemap-adapter-python-0.1.0.tgz" >/dev/null
          cd "$smoke"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$packs"/*.tgz
          test -f node_modules/tree-sitter-python/tree-sitter-python.wasm
          test -f node_modules/tree-sitter-typescript/tree-sitter-tsx.wasm
          export CODEMAP_DATA_DIR="$RUNNER_TEMP/codemap-data"
          npx codemap --version
          npx codemap doctor
          npx codemap scan "$GITHUB_WORKSPACE/tests/fixtures/fixture-ts-paths"
          cd "$GITHUB_WORKSPACE/tests/fixtures/fixture-ts-paths"
          npx --prefix "$smoke" codemap export --format svg --output "$RUNNER_TEMP/map.svg"
          test -s "$RUNNER_TEMP/map.svg"
          npx --prefix "$smoke" codemap export --format png --output "$RUNNER_TEMP/map.png"
          test -s "$RUNNER_TEMP/map.png"
